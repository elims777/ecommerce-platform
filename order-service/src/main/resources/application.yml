server:
  port: 8084

spring:
  application:
    name: order-service
  # нет своего UserDetailsService — иначе Spring создаёт дефолтного юзера и пишет его пароль в лог
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:${ORDER_DB_PORT:5435}/${ORDER_DB_NAME:order_db}
    username: ${ORDER_DB_USER}
    password: ${ORDER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  task:
    scheduling:
      pool:
        size: 3

  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# Yandex Object Storage Configuration
yandex:
  storage:
    access-key: "${YANDEX_STORAGE_ACCESS_KEY}"
    secret-key: "${YANDEX_STORAGE_SECRET_KEY}"
    bucket-name: ecommerce-products
    endpoint: https://storage.yandexcloud.net
    region: ru-central1

services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8090}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}

internal:
  secret: ${INTERNAL_SECRET}

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

jwt:
  secret: "${SECRET_JWT}"

app:
  kafka:
    topics:
      order-events: order-events
      order-1c-export: order-1c-export
      payment-processed: payment.processed

# Ключи API транспортных компаний; пусто — ТК отключена в синхронизации терминалов
carriers:
  cdek:
    base-url: ${CDEK_BASE_URL:https://api.cdek.ru/v2}
    client-id: ${CDEK_CLIENT_ID:}
    client-secret: ${CDEK_CLIENT_SECRET:}
  dellin:
    base-url: ${DELLIN_BASE_URL:https://api.dellin.ru}
    appkey: ${DELLIN_APPKEY:}
    login: ${DELLIN_LOGIN:}
    password: ${DELLIN_PASSWORD:}
  pec:
    base-url: ${PEC_BASE_URL:https://kabinet.pecom.ru}
    login: ${PEC_LOGIN:}
    api-key: ${PEC_API_KEY:}
  baikal:
    base-url: ${BAIKAL_BASE_URL:https://api.baikalsr.ru}
    api-key: ${BAIKAL_API_KEY:}
  vozovoz:
    base-url: ${VOZOVOZ_BASE_URL:https://vozovoz.ru}
    token: ${VOZOVOZ_TOKEN:}

# ИНН нашей компании — для направления отправлений в журнале ТК
company:
  inn: ${COMPANY_INN:}
