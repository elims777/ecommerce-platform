spring:
  config:
    activate:
      on-profile: test
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-login
              uri: http://localhost:19999
              predicates:
                - Path=/v1/auth/login
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 1
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"

            - id: auth-forgot-password
              uri: http://localhost:19999
              predicates:
                - Path=/api/v1/auth/forgot-password
                - Method=POST
              filters:
                - RewritePath=/api(?<segment>/?.*), ${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 3
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"

            - id: auth-api
              uri: http://localhost:19999
              predicates:
                - Path=/v1/auth/**

            - id: auth-api-prefixed
              uri: http://localhost:19999
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - RewritePath=/api(?<segment>/?.*), ${segment}

            - id: global-limit-test
              uri: http://localhost:19999
              metadata:
                global-rate: 1
              predicates:
                - Path=/api/verification/**

            - id: product-api
              uri: http://localhost:19999
              predicates:
                - Path=/api/v1/products/**

            - id: category-api
              uri: http://localhost:19999
              predicates:
                - Path=/api/v1/categories/**

            - id: orders-create
              uri: http://localhost:19999
              predicates:
                - Path=/api/v1/orders
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    # replenish 1 (прод 2): тест не должен зависеть от скорости CI
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"

            - id: order-api
              uri: http://localhost:19999
              predicates:
                - Path=/api/v1/orders/**

            - id: order-cart
              uri: http://localhost:19999
              predicates:
                - Path=/api/v1/cart/**

            - id: user-legal-entities
              uri: http://localhost:19999
              predicates:
                - Path=/api/v1/legal-entities/**

            - id: integration-logs
              uri: http://localhost:19999
              predicates:
                - Path=/api/v1/admin/integration/logs
              filters:
                - RewritePath=/api/v1/admin/integration/logs, /api/v1/integration/logs

jwt:
  secret: test-secret-key-for-testing-must-be-at-least-256-bits-long-for-hs256

logging:
  level:
    ru.rfsnab.gatewayservice: DEBUG